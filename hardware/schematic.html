<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.T.A.L.K.E.R. PDA Schematic</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #060a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace
    }

    h1 {
      font-size: 1rem;
      background: linear-gradient(90deg, #e87c20, #f5c842);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: .6rem;
      color: #667
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 3px
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block
    }

    svg {
      width: 100%;
      height: 100vh;
      cursor: grab;
    }

    svg:active {
      cursor: grabbing;
    }
  </style>
</head>

<body>
  <h1>ESP32-S3-N16R8 Pinout + Buses</h1>
  <div class="legend">
    <span><span class="dot" style="background:#ffffff;border:1.5px solid #111"></span>GND</span>
    <span><span class="dot" style="background:#ff9922"></span>UART</span>
    <span><span class="dot" style="background:#cc88ff"></span>BU03</span>
    <span><span class="dot" style="background:#cc2222"></span>Strap</span>
    <span><span class="dot" style="background:#ffdd44"></span>Switch in</span>
    <span style="color:#998822;font-size:11px;margin-left:8px">TFT LED → 3V3 (всегда ON); G37/G38 — свободны; G4-G7 — кнопки без назначения</span>
  </div>
  <svg id="s" viewBox="-50 0 1600 1300" xmlns="http://www.w3.org/2000/svg"></svg>

  <script>

    const C = {
      pwr: '#cc3333', gnd: '#ffffff', rst: '#888',
      btn: '#44ee66', ok: '#ff8844', sw: '#ffdd44',
      uart: '#ff9922', i2c: '#44ccaa', spi: '#ffcc00',
      strap: '#666666', free: '#1e2e40',
      led_g: '#33dd55', led_r: '#ff4444', vib: '#aaaaaa',
      v5: '#ff7700'
    };
    const LEFT = [
      ['3V3', C.pwr, ''],
      ['3V3', C.pwr, ''],
      ['RST', C.rst, ''],
      ['G4', C.free, ''],       // free (кнопка 1, без назначения)
      ['G5', C.free, ''],       // free (кнопка 2, без назначения)
      ['G6', C.free, ''],       // free (кнопка 3, без назначения)
      ['G7', C.free, ''],       // free (кнопка 4, без назначения)
      ['G15', C.led_r, ''],     // LED
      ['G16', C.led_g, ''],     // LED
      ['G17', C.uart, ''],
      ['G18', C.uart, ''],
      ['G8', C.i2c, ''],        // SCL
      ['G3', C.strap, ''],
      ['G46', C.strap, ''],
      ['G9', C.i2c, ''],        // SDA
      ['G10', C.spi, ''],        // TFT CS
      ['G11', C.spi, ''],        // TFT DC
      ['G12', '#ffaa44', ''],    // Shared RST (TFT+LoRa)
      ['G13', C.spi, ''],        // SPI SCK shared
      ['G14', C.spi, ''],        // SPI MOSI/SDI shared
      ['5Vin', C.v5, ''],
      ['GND', C.gnd, ''],
    ];
    const RIGHT = [
      ['GND', C.gnd, ''],
      ['TX', C.strap, ''],
      ['RX', C.strap, ''],
      ['G1', C.uart, ''],        // BU03 RX ← PA2(TX)
      ['G2', C.uart, ''],        // BU03 TX → RX
      ['G42', '#cc88ff', ''],    // BU03_PWR (P-MOS)
      ['G41', '#4488ff', ''],    // LoRa DIO0
      ['G40', C.spi, ''],        // SPI MISO shared
      ['G39', '#4488ff', ''],    // LoRa CS
      ['G38', C.free, ''],      // free
      ['G37', C.free, ''],      // free
      ['G36', C.strap, ''],
      ['G35', C.strap, ''],
      ['G0', C.strap, ''],
      ['G45', C.strap, ''],
      ['G48', C.sw, 'VIB'],
      ['G47', C.sw, 'SND'],
      ['G21', C.vib, ''],
      ['G20', C.strap, ''],
      ['G19', C.strap, ''],
      ['GND', C.gnd, ''],
      ['GND', C.gnd, ''],
    ];
    const PCB_X = 502, PCB_Y = 62, PCB_W = 214, PCB_H = 506;
    const PIN_XL = 489;           // left pin dot x
    const PIN_XR = 719;           // right pin dot x
    const PIN_Y0 = 72;            // first pin y
    const PIN_DY = 22;            // pin step
    const LBAR_X = 476, LBAR_W = 13; // left header bar
    const RBAR_X = 723, RBAR_W = 13; // right header bar
    const BUS_3V3_Y = 10;         // 3V3 bus y (верхняя шина питания)
    const BUS_GND_Y = 680;        // GND bus y
    const BUS_5V_X = 28;         // 5V bus x (vertical, left side)
    const BUS_X1 = 28, BUS_X2 = 1375; // bus horizontal extent

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('s');

    function el(tag, attrs, text) {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text !== undefined) e.textContent = text;
      svg.appendChild(e);
      return e;
    }
    el('line', { x1: BUS_X1, y1: BUS_3V3_Y, x2: BUS_X2, y2: BUS_3V3_Y, stroke: '#ff4444', 'stroke-width': 3 });
    el('text', { x: BUS_X1 + 4, y: BUS_3V3_Y - 6, fill: '#ff6666', 'font-family': 'JetBrains Mono', 'font-size': 9, 'font-weight': 'bold' }, '3V3 BUS');
    el('line', { x1: BUS_X1, y1: BUS_GND_Y, x2: BUS_X2, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 3 });
    el('text', { x: BUS_X1 + 4, y: BUS_GND_Y + 12, fill: '#778', 'font-family': 'JetBrains Mono', 'font-size': 9, 'font-weight': 'bold' }, 'GND BUS');
    const pcbGrad = el('defs', {});
    const lg = document.createElementNS(NS, 'linearGradient');
    lg.setAttribute('id', 'gPcb'); lg.setAttribute('x1', '0'); lg.setAttribute('y1', '0'); lg.setAttribute('x2', '0'); lg.setAttribute('y2', '1');
    const s1 = document.createElementNS(NS, 'stop'); s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#0c1c0e');
    const s2 = document.createElementNS(NS, 'stop'); s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', '#071009');
    lg.appendChild(s1); lg.appendChild(s2); pcbGrad.appendChild(lg); svg.appendChild(pcbGrad);

    el('rect', { x: PCB_X, y: PCB_Y, width: PCB_W, height: PCB_H, rx: 8, fill: 'url(#gPcb)', stroke: '#1a3a1a', 'stroke-width': 1.5 });

    const CX = PCB_X + PCB_W / 2; // center X of PCB
    el('text', { x: CX, y: PCB_Y - 9, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#3a6a3a' }, 'Антенна');
    el('line', { x1: CX, y1: PCB_Y - 4, x2: CX, y2: PCB_Y + 4, stroke: '#3a6a3a', 'stroke-width': 1 });
    const USBC_Y = PCB_Y + PCB_H + 2;
    el('rect', { x: CX - 60, y: USBC_Y, width: 52, height: 12, rx: 3, fill: '#0e0e0e', stroke: '#334', 'stroke-width': 1 });
    el('text', { x: CX, y: USBC_Y + 9, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6.5, fill: '#334' }, 'USB-C x2');
    el('rect', { x: PCB_X + 22, y: PCB_Y + 175, width: 150, height: 130, rx: 5, fill: '#0a1828', stroke: '#1a3060', 'stroke-width': 1.5 });
    el('text', { x: CX, y: PCB_Y + 232, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 13, 'font-weight': 'bold', fill: '#3366aa' }, 'ESP32-S3');
    el('text', { x: CX, y: PCB_Y + 263, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6.5, fill: '#1a3050' }, '16MB / 8MB PSRAM');
    el('text', { x: CX, y: PCB_Y + 277, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6.5, fill: '#1a3050' }, 'Wi-Fi / BT5 / ESP-NOW');
    el('text', { x: CX, y: PCB_Y + 291, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6.5, fill: '#1a3050' }, 'LX7x2 / 240MHz');
    el('rect', { x: PCB_X + 22, y: PCB_Y + 395, width: 28, height: 13, rx: 2, fill: '#111', stroke: '#445', 'stroke-width': 1 });
    el('text', { x: PCB_X + 36, y: PCB_Y + 404, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6, fill: '#667' }, 'BOOT');
    el('rect', { x: PCB_X + 62, y: PCB_Y + 395, width: 28, height: 13, rx: 2, fill: '#111', stroke: '#445', 'stroke-width': 1 });
    el('text', { x: PCB_X + 76, y: PCB_Y + 404, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6, fill: '#667' }, 'RST');
    el('circle', { cx: PCB_X + 120, cy: PCB_Y + 416, r: 5, fill: '#130900', stroke: '#553300', 'stroke-width': 1 });
    el('text', { x: PCB_X + 120, y: PCB_Y + 419, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#775522' }, 'RGB');
    el('rect', { x: LBAR_X, y: PCB_Y + 6, width: LBAR_W, height: PCB_H - 12, rx: 2, fill: '#161000', stroke: '#3a2800', 'stroke-width': 1 });
    el('rect', { x: RBAR_X, y: PCB_Y + 6, width: RBAR_W, height: PCB_H - 12, rx: 2, fill: '#161000', stroke: '#3a2800', 'stroke-width': 1 });
    function drawPins(pins, dotX, isLeft) {
      pins.forEach(([label, color, note], i) => {
        const y = PIN_Y0 + i * PIN_DY;
        const r = color === C.free || color === C.gnd || color === C.rst ? 3.5 : 5;
        if (color === C.gnd) {
          el('circle', { cx: dotX, cy: y, r, fill: '#ffffff', stroke: '#111111', 'stroke-width': 1.5 });
        } else if (color === C.strap) {
          el('circle', { cx: dotX, cy: y, r: 4.5, fill: '#cc2222', stroke: '#ff4444', 'stroke-width': 1 });
          el('line', { x1: dotX - 3, y1: y - 3, x2: dotX + 3, y2: y + 3, stroke: '#ffffff', 'stroke-width': 1.5 });
        } else {
          el('circle', { cx: dotX, cy: y, r, fill: color });
        }
        const textCol = color === C.gnd ? '#999999' : color === C.strap ? '#883333' : color;
        const innerX = isLeft ? dotX + 9 : dotX - 9;
        const anchor = isLeft ? 'start' : 'end';
        const isBold = (r > 3.5) ? 'bold' : 'normal';
        el('text', { x: innerX, y: y + 3, 'text-anchor': anchor, 'font-family': 'JetBrains Mono', 'font-size': 7.5, 'font-weight': isBold, fill: textCol }, label);
        if (note) {
          const outerX = isLeft ? dotX - 10 : dotX + 10;
          const outerAnchor = isLeft ? 'end' : 'start';
          el('text', { x: outerX, y: y + 3, 'text-anchor': outerAnchor, 'font-family': 'JetBrains Mono', 'font-size': 6.5, fill: textCol }, note);
        }
      });
    }

    drawPins(LEFT, PIN_XL, true);
    drawPins(RIGHT, PIN_XR, false);
    // 3V3 пин ESP — потребитель (питание от TPS63020 →3.3V), не источник шины
    const y5V = PIN_Y0 + 20 * PIN_DY;
    const V5_VX = BUS_5V_X + 55; // x=83, правее блока TPS63020 3.3V
    const V5_TAP_X = BUS_5V_X - 30;
    // ESP 5Vin — рисуется ниже, после TFT (обход дисплея сверху)

    const yGndL = PIN_Y0 + 21 * PIN_DY;
    el('line', { x1: PIN_XL, y1: yGndL, x2: PIN_XL, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 1.5 });
    el('circle', { cx: PIN_XL, cy: BUS_GND_Y, r: 3, fill: '#556' });
    const TFT_W = 150, TFT_H = 142;
    const TFT_X = 220;
    const TFT_PIN_DY = PIN_DY; // same spacing as ESP = parallel wires!
    const espPinY = (idx) => PIN_Y0 + idx * PIN_DY;
    const TFT_PIN_Y0 = espPinY(15); // first TFT pin = same y as G10
    const TFT_Y = TFT_PIN_Y0 - 15; // a bit of padding above first pin
    const TFT_PIN_X = TFT_X + TFT_W; // right edge
    el('rect', { x: TFT_X, y: TFT_Y, width: TFT_W, height: TFT_H, rx: 6, fill: '#041818', stroke: '#22aa77', 'stroke-width': 1.5 });
    el('rect', { x: TFT_X + 10, y: TFT_Y + 8, width: TFT_W - 20, height: 50, rx: 3, fill: '#051810', stroke: '#1a7744', 'stroke-width': 1 });
    el('text', { x: TFT_X + TFT_W / 2, y: TFT_Y + 44, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#228855' }, 'TFT 2.4" ILI9341');
    const tftPins = [
      ['CS',  '#ffcc00'],
      ['DC',  '#ffcc00'],
      ['RST', '#ffaa44'],   // shared RST
      ['SCK', '#ffcc00'],
      ['SDI', '#ffcc00'],
    ];

    tftPins.forEach(([label, color], i) => {
      const y = TFT_PIN_Y0 + i * TFT_PIN_DY;
      el('circle', { cx: TFT_PIN_X, cy: y, r: 2.5, fill: color });
      el('text', { x: TFT_PIN_X - 8, y: y + 3, 'text-anchor': 'end', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: color }, label);
    });
    // G10=CS(idx15), G11=DC(idx16), G12=SharedRST(idx17), G13=SCK(idx18), G14=MOSI(idx19)
    const spiColors = ['#ffcc00', '#ffcc00', '#ffaa44', '#ffcc00', '#ffcc00'];
    const spiIdxs = [15, 16, 17, 18, 19];

    spiIdxs.forEach((espIdx, tftIdx) => {
      const tftY = TFT_PIN_Y0 + tftIdx * TFT_PIN_DY;
      const espY = espPinY(espIdx);
      el('line', { x1: TFT_PIN_X, y1: tftY, x2: PIN_XL, y2: espY, stroke: spiColors[tftIdx], 'stroke-width': 1.8 });
    });
    const tftVccX = TFT_X + TFT_W - 5;
    el('circle', { cx: tftVccX, cy: TFT_Y, r: 2.5, fill: '#ff4444' });
    el('text', { x: tftVccX + 6, y: TFT_Y + 3, 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#ff4444' }, 'VCC');
    el('line', { x1: tftVccX, y1: TFT_Y, x2: tftVccX, y2: BUS_3V3_Y, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('circle', { cx: tftVccX, cy: BUS_3V3_Y, r: 3, fill: '#cc3333' });
    const tftGndX = TFT_X + 5;
    el('circle', { cx: tftGndX, cy: TFT_Y + TFT_H, r: 2.5, fill: '#556' });
    el('text', { x: tftGndX + 6, y: TFT_Y + TFT_H + 3, 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#556' }, 'GND');
    el('line', { x1: tftGndX, y1: TFT_Y + TFT_H, x2: tftGndX, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 1.5 });
    el('circle', { cx: tftGndX, cy: BUS_GND_Y, r: 3, fill: '#556' });
    // LED подсветки: J_TFT LED → 3V3 постоянно (v3); тумблер BL — только G37/G38 (не в цепи LED)
    const tftLedY = TFT_Y + TFT_H - 12;
    const BL_SW_X = tftVccX + 42;
    el('circle', { cx: TFT_PIN_X, cy: tftLedY, r: 2.5, fill: C.pwr });
    el('text', { x: TFT_PIN_X - 8, y: tftLedY + 3, 'text-anchor': 'end', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#ff4444' }, 'LED');
    // LED напрямую на 3V3 (подсветка всегда при питании)
    el('line', { x1: TFT_PIN_X, y1: tftLedY, x2: tftVccX, y2: tftLedY, stroke: C.pwr, 'stroke-width': 1.5 });
    el('line', { x1: tftVccX, y1: tftLedY, x2: tftVccX, y2: BUS_3V3_Y, stroke: C.pwr, 'stroke-width': 1.5 });
    el('text', { x: tftVccX + 6, y: tftLedY - 4, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#aa5533' }, '→3V3');
    // G37/G38 — свободны, без назначения (был тумблер BL — убран)
    const blInY = tftLedY + 22;
    el('text', { x: BL_SW_X, y: blInY + 4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#556' }, 'G37/G38: свободны');

    // ESP 5Vin и общая шина 5V — рисуются после MUX (ниже SPI/SCK, обход MUX снизу)
    const v5BusY = PCB_Y + PCB_H + 55; // под LoRa SPI (SCK/RST ~609) и USB-C
    const esp5vDropX = PIN_XL - 6;

    const BTN_W = 70, BTN_H = 18;
    const BTN_X = 160;
    const BTN_PIN_X = BTN_X + BTN_W;

    const buttons = [
      { label: '1', color: '#888888', espIdx: 3 },
      { label: '2', color: '#888888', espIdx: 4 },
      { label: '3', color: '#888888', espIdx: 5 },
      { label: '4', color: '#888888', espIdx: 6 },
    ];

    const btnGroupY = espPinY(3) - 14;
    el('text', { x: BTN_X + BTN_W / 2, y: btnGroupY, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#446644' }, 'Кнопки 1-4 (без назначения)');
    const btnGndX = BTN_X - 70;
    el('line', { x1: btnGndX, y1: espPinY(3), x2: btnGndX, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 1.5 });
    el('circle', { cx: btnGndX, cy: BUS_GND_Y, r: 3, fill: '#556' });

    buttons.forEach(({ label, color, espIdx }) => {
      const y = espPinY(espIdx);
      el('rect', { x: BTN_X, y: y - BTN_H / 2, width: BTN_W, height: BTN_H, rx: 4, fill: '#0a1410', stroke: color, 'stroke-width': 1.5 });
      el('text', { x: BTN_X + BTN_W / 2, y: y + 4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 8, fill: color }, label);
      el('circle', { cx: BTN_PIN_X, cy: y, r: 2.5, fill: color });
      el('line', { x1: BTN_PIN_X, y1: y, x2: PIN_XL, y2: y, stroke: color, 'stroke-width': 1.8 });
      el('circle', { cx: BTN_X, cy: y, r: 2.5, fill: '#556' });
      el('line', { x1: BTN_X, y1: y, x2: btnGndX, y2: y, stroke: '#556', 'stroke-width': 1.2 });
    });

    // ═══ ВИБРОМОТОР LRA (корпус) + Q1 2N2222 + D1 1N5819 ═══
    const VIB_BLK_X = PIN_XR + 480;
    const VIB_BLK_Y = espPinY(17) - 55;
    const VIB_BLK_W = 200;
    const VIB_BLK_H = 118;
    el('rect', { x: VIB_BLK_X, y: VIB_BLK_Y, width: VIB_BLK_W, height: VIB_BLK_H, rx: 6, fill: '#0c0c10', stroke: '#888', 'stroke-width': 1.2, 'stroke-dasharray': '6,3' });
    el('text', { x: VIB_BLK_X + VIB_BLK_W / 2, y: VIB_BLK_Y + 12, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, 'font-weight': 'bold', fill: '#aaa' }, '\ud83d\udcf3 \u0412\u0438\u0431\u0440\u043e (LRA, \u043a\u043e\u0440\u043f\u0443\u0441)');
    el('text', { x: VIB_BLK_X + VIB_BLK_W / 2, y: VIB_BLK_Y + 22, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#666' }, '5V\u2192[VIB]\u2192M+; G21\u2192R220\u03a9\u2192Q1\u2192M\u2212');

    const g2Y = espPinY(17);
    const RES_W = 28;
    const R1_X = VIB_BLK_X + 12;
    const R1_Y = VIB_BLK_Y + 52;
    el('line', { x1: PIN_XR, y1: g2Y, x2: R1_X - 8, y2: g2Y, stroke: C.vib, 'stroke-width': 1.8 });
    el('text', { x: PIN_XR + 28, y: g2Y - 5, 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: C.vib }, 'G21');
    el('line', { x1: R1_X - 8, y1: g2Y, x2: R1_X - 8, y2: R1_Y, stroke: C.vib, 'stroke-width': 1.5 });
    el('line', { x1: R1_X - 8, y1: R1_Y, x2: R1_X, y2: R1_Y, stroke: C.vib, 'stroke-width': 1.5 });
    el('rect', { x: R1_X, y: R1_Y - 5, width: RES_W, height: 10, rx: 2, fill: '#1a1a1a', stroke: '#888', 'stroke-width': 1 });
    el('text', { x: R1_X + RES_W / 2, y: R1_Y + 3, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#aaa' }, '220\u03a9');

    const TX = R1_X + RES_W + 22;
    const TY = R1_Y;
    el('line', { x1: R1_X + RES_W, y1: R1_Y, x2: TX - 8, y2: TY, stroke: '#aaa', 'stroke-width': 1.5 });
    el('line', { x1: TX - 8, y1: TY - 14, x2: TX - 8, y2: TY + 14, stroke: '#aaa', 'stroke-width': 2 });
    el('line', { x1: TX - 16, y1: TY, x2: TX - 8, y2: TY, stroke: '#aaa', 'stroke-width': 1.5 });
    el('line', { x1: TX - 8, y1: TY - 8, x2: TX + 6, y2: TY - 18, stroke: '#aaa', 'stroke-width': 1.5 });
    el('line', { x1: TX - 8, y1: TY + 8, x2: TX + 6, y2: TY + 18, stroke: '#aaa', 'stroke-width': 1.5 });

    const LORA_W = 100, LORA_H = 80;

    const LORA_X = PIN_XR + 200;

    // LoRa — центр по CS(G39) и DIO0(G41); UWB — отдельно по UART-пинам
    const LORA_CY = (espPinY(6) + espPinY(8)) / 2;

    // ── LoRa SX1278 ──
    el('rect', { x: LORA_X, y: LORA_Y, width: LORA_W, height: LORA_H, rx: 6, fill: '#0a1020', stroke: '#4488ff', 'stroke-width': 1.5 });

    el('text', { x: LORA_X + LORA_W / 2, y: LORA_CY - 18, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 9, 'font-weight': 'bold', fill: '#4488ff' }, 'SX1278 Ra-01');
    el('text', { x: LORA_X + LORA_W / 2, y: LORA_CY - 6, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#336699' }, 'LoRa 433MHz (+ANT)');

    // CS=G39(idx8), DIO0=G41(idx6). RST=G12 shared — drawn via left side
    const loraPins = [
      { label: 'CS',   espIdx: 8, color: '#4488ff' },   // G39
      { label: 'DIO0', espIdx: 6, color: '#4488ff' },   // G41
    ];
    loraPins.forEach(({ label, espIdx, color }) => {
      const y = espPinY(espIdx);
      el('circle', { cx: LORA_X, cy: y, r: 2.5, fill: color });
      el('text', { x: LORA_X + 8, y: y + 3, 'font-family': 'JetBrains Mono', 'font-size': 6, fill: color }, label);
      el('line', { x1: PIN_XR, y1: y, x2: LORA_X, y2: y, stroke: color, 'stroke-width': 1.5 });
    });
    const spiRouteBase = PCB_Y + PCB_H + 25; // between USB-C label and GND bus
    const spiJunctionXBase = (TFT_X + TFT_W + PIN_XL) / 2 - 8; // between TFT right edge and ESP left pins

    // SPI+RST from LoRa bottom: MOSI=G14(idx19), SCK=G13(idx18), SharedRST=G12(idx17)
    const spiPins = [
      { label: 'MOSI', loraX: LORA_X + 20, leftIdx: 19, routeOff:  0, jOff:  0, col: '#44ccaa' },
      { label: 'SCK',  loraX: LORA_X + 50, leftIdx: 18, routeOff:  8, jOff:  8, col: '#44ccaa' },
      { label: 'RST',  loraX: LORA_X + 80, leftIdx: 17, routeOff: 16, jOff: 16, col: '#ffaa44' },
    ];
    spiPins.forEach(({ label, loraX, leftIdx, routeOff, jOff, col }) => {
      const pinY = PIN_Y0 + leftIdx * PIN_DY;
      const routeY = spiRouteBase + routeOff;
      const jx = spiJunctionXBase + jOff;
      el('circle', { cx: loraX, cy: LORA_Y + LORA_H, r: 2, fill: col });

      el('line', { x1: jx, y1: routeY, x2: jx, y2: pinY, stroke: col, 'stroke-width': 1.2 });
      el('circle', { cx: jx, cy: pinY, r: 3.5, fill: col });
      el('text', { x: loraX, y: LORA_Y + LORA_H - 5, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: col }, label);
    });
    // MISO=G40 (right side, rightIdx7): LoRa left-side → straight left to PIN_XR at G40 y
    const misoY = PIN_Y0 + 7 * PIN_DY; // G40 y = 226
    el('circle', { cx: LORA_X, cy: misoY, r: 2.5, fill: '#44ccaa' });
    el('text', { x: LORA_X + 6, y: misoY - 2, 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#44ccaa' }, 'MISO');
    el('line', { x1: LORA_X, y1: misoY, x2: PIN_XR, y2: misoY, stroke: '#44ccaa', 'stroke-width': 1.5 });
    el('circle', { cx: PIN_XR, cy: misoY, r: 3.5, fill: '#44ccaa' });

    const loraVccX = LORA_X + 5;
    el('line', { x1: loraVccX, y1: LORA_Y, x2: loraVccX, y2: BUS_3V3_Y, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('circle', { cx: loraVccX, cy: BUS_3V3_Y, r: 3, fill: '#cc3333' });
    el('text', { x: loraVccX + 5, y: LORA_Y + 10, 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc3333' }, 'VCC');
    const loraGndX = LORA_X + LORA_W - 5;
    el('line', { x1: loraGndX, y1: LORA_Y + LORA_H, x2: loraGndX, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 1.5 });
    el('circle', { cx: loraGndX, cy: BUS_GND_Y, r: 3, fill: '#556' });
    el('text', { x: LORA_X + LORA_W - 10, y: LORA_Y + LORA_H - 5, 'text-anchor': 'end', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#556' }, 'GND');

    // ═══ UWB: BU03-Kit (UART AT, TWR) — отдельно от LoRa, общий RF_CY ═══
    el('rect', { x: UWB_X, y: UWB_Y, width: UWB_W, height: UWB_H, rx: 6, fill: '#0a0a20', stroke: '#cc88ff', 'stroke-width': 1.5 });
    const uwbAntX = UWB_X + UWB_W - 14, uwbAntY = UWB_Y - 24;
    el('line', { x1: uwbAntX, y1: UWB_Y, x2: uwbAntX, y2: uwbAntY, stroke: '#cc88ff', 'stroke-width': 2 });
    el('path', { d: `M${uwbAntX - 8},${uwbAntY + 5} Q${uwbAntX},${uwbAntY - 5} ${uwbAntX + 8},${uwbAntY + 5}`, fill: 'none', stroke: '#cc88ff', 'stroke-width': 1.5 });
    el('path', { d: `M${uwbAntX - 14},${uwbAntY + 10} Q${uwbAntX},${uwbAntY - 10} ${uwbAntX + 14},${uwbAntY + 10}`, fill: 'none', stroke: '#aa66cc', 'stroke-width': 1 });
    el('text', { x: uwbAntX, y: uwbAntY - 6, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#cc88ff' }, 'ANT');
    el('text', { x: UWB_X + UWB_W / 2, y: UWB_CY - 18, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 9, 'font-weight': 'bold', fill: '#cc88ff' }, 'BU03-Kit');
    el('text', { x: UWB_X + UWB_W / 2, y: UWB_CY - 6, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6, fill: '#9966cc' }, 'STM32 + DW3000');
    el('text', { x: UWB_X + UWB_W / 2, y: UWB_CY + 6, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#7744aa' }, 'UART 115200 AT');
    el('text', { x: UWB_X + UWB_W / 2, y: UWB_CY + 18, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#7744aa' }, 'PA2(TX)→G1  G2→RX');
    el('text', { x: UWB_X + UWB_W / 2, y: UWB_CY + 30, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#6644aa' }, 'керам. антенна');
    const bu03UartPins = [
      { label: 'TX→G1', espIdx: 3, color: '#ff9922' },
      { label: 'RX←G2', espIdx: 4, color: '#ff9922' },
    ];
    bu03UartPins.forEach(({ label, espIdx, color }) => {
      const y = espPinY(espIdx);
      el('circle', { cx: UWB_X, cy: y, r: 2.5, fill: color });
      el('text', { x: UWB_X + 8, y: y + 3, 'font-family': 'JetBrains Mono', 'font-size': 6, fill: color }, label);
      el('line', { x1: PIN_XR, y1: y, x2: UWB_X, y2: y, stroke: color, 'stroke-width': 1.5 });
    });
    // ═══ BU03 POWER KEY: справа от BU03; VCC — с правого края модуля ═══
    const bu03PwrY = espPinY(5);
    const uwbVccRightX = UWB_X + UWB_W;
    const uwbVccPinY = UWB_CY - 8;
    const uwbGndX = UWB_X + UWB_W - 8;
    const g42BypassY = UWB_Y - 34; // обход модуля BU03 сверху (ниже антенн)

    const BU_PWR_W = 268;
    const BU_PWR_H = 100;

    el('rect', { x: BU_PWR_X, y: BU_PWR_Y, width: BU_PWR_W, height: BU_PWR_H, rx: 6, fill: '#0a0818', stroke: '#cc88ff', 'stroke-width': 1.2, 'stroke-dasharray': '6,3' });

    const g42PreX = UWB_X - 14;
    el('line', { x1: PIN_XR, y1: bu03PwrY, x2: g42PreX, y2: bu03PwrY, stroke: '#cc88ff', 'stroke-width': 1.5 });
    el('text', { x: PIN_XR + 8, y: bu03PwrY - 5, 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc88ff' }, 'G42');
    el('line', { x1: g42PreX, y1: bu03PwrY, x2: g42PreX, y2: g42BypassY, stroke: '#cc88ff', 'stroke-width': 1.5 });
    el('line', { x1: g42PreX, y1: g42BypassY, x2: BU_PWR_X + 8, y2: g42BypassY, stroke: '#cc88ff', 'stroke-width': 1.5 });
    el('line', { x1: BU_PWR_X + 8, y1: g42BypassY, x2: BU_PWR_X + 8, y2: buSigY, stroke: '#cc88ff', 'stroke-width': 1.5 });

    const buRX = BU_PWR_X + 28;

    // Q2 2N2222 (NPN, эмиттер на GND)
    const buQX = buRX + bu03ResW + 34;

    el('text', { x: buQX - 2, y: buQY - 22, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6, fill: '#cc88ff' }, 'Q2');
    el('text', { x: buQX + 12, y: buQY - 10, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#888' }, 'C\u2192G');
    el('text', { x: buQX + 12, y: buQY + 14, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#888' }, 'E\u2192GND');
    const buEX = buQX + 4;
    el('line', { x1: buEX, y1: buQY + 16, x2: buEX, y2: buGndY, stroke: '#556', 'stroke-width': 1.5 });
    el('line', { x1: BU_PWR_X + 12, y1: buGndY, x2: buEX, y2: buGndY, stroke: '#556', 'stroke-width': 1.5 });
    el('line', { x1: BU_PWR_X + 12, y1: buGndY, x2: BU_PWR_X + 12, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 1.5 });
    el('circle', { cx: BU_PWR_X + 12, cy: BUS_GND_Y, r: 3, fill: '#556' });

    // P-MOS AO3401 (SOT-23): канал по центру, подписи сбоку
    const pmX = buQX + 60;
    const pmTop = BU_PWR_Y + 42;
    const pmBot = BU_PWR_Y + 78;
    const pmGateY = (pmTop + pmBot) / 2;
    const pmChanX = pmX + 10;
    el('line', { x1: buQX + 4, y1: buQY - 16, x2: pmX, y2: pmGateY, stroke: '#cc88ff', 'stroke-width': 1.5 });
    el('circle', { cx: pmX, cy: pmGateY, r: 2.2, fill: '#cc88ff' });
    el('line', { x1: pmX, y1: pmGateY, x2: pmChanX, y2: pmGateY, stroke: '#cc88ff', 'stroke-width': 1.5 });
    el('line', { x1: pmChanX, y1: pmTop, x2: pmChanX, y2: pmBot, stroke: '#cc88ff', 'stroke-width': 3 });
    el('line', { x1: pmChanX, y1: pmTop, x2: pmChanX + 12, y2: pmTop - 10, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('line', { x1: pmChanX, y1: pmBot, x2: pmChanX + 12, y2: pmBot + 10, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('text', { x: pmX - 10, y: pmGateY + 3, 'text-anchor': 'end', 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#888' }, 'G');
    el('text', { x: pmChanX + 26, y: pmTop - 8, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#cc3333' }, 'S\u21923V3');
    el('text', { x: pmChanX + 26, y: pmBot + 16, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#cc3333' }, 'D\u2192VCC');
    el('text', { x: pmChanX + 26, y: pmGateY + 2, 'font-family': 'JetBrains Mono', 'font-size': 6, 'font-weight': 'bold', fill: '#cc88ff' }, 'AO3401');
    el('text', { x: pmChanX + 26, y: pmGateY + 11, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#9966cc' }, 'P-MOS');

    // R8 10k: gate → 3.3V
    const pmGateX = pmX;
    el('line', { x1: pmGateX, y1: pmGateY, x2: pmGateX, y2: bu3v3RailY + 14, stroke: '#cc88ff', 'stroke-width': 1.2 });
    el('rect', { x: pmGateX - 5, y: bu3v3RailY + 14, width: 10, height: 18, rx: 1, fill: '#060a12', stroke: '#cc88ff', 'stroke-width': 1 });
    el('line', { x1: pmGateX, y1: bu3v3RailY + 32, x2: pmGateX, y2: bu3v3RailY, stroke: '#cc88ff', 'stroke-width': 1.2 });
    el('text', { x: pmGateX - 8, y: bu3v3RailY + 26, 'text-anchor': 'end', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc88ff' }, 'R8 10k');

    // 3.3V BUS → Source
    const pmSrcX = pmChanX + 12;
    el('line', { x1: pmSrcX, y1: pmTop - 10, x2: pmSrcX, y2: bu3v3RailY, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('line', { x1: BU_PWR_X + BU_PWR_W - 10, y1: bu3v3RailY, x2: pmSrcX, y2: bu3v3RailY, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('circle', { cx: BU_PWR_X + BU_PWR_W - 10, cy: bu3v3RailY, r: 2.5, fill: '#cc3333' });
    el('line', { x1: BU_PWR_X + BU_PWR_W - 10, y1: bu3v3RailY, x2: BU_PWR_X + BU_PWR_W - 10, y2: BUS_3V3_Y, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('circle', { cx: BU_PWR_X + BU_PWR_W - 10, cy: BUS_3V3_Y, r: 3, fill: '#cc3333' });
    el('text', { x: BU_PWR_X + BU_PWR_W - 6, y: bu3v3RailY - 4, 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc3333' }, '3.3V');

    // Drain → горизонталь на уровне правого пина VCC BU03
    const pmDrainX = pmChanX + 12;
    el('line', { x1: pmDrainX, y1: pmBot + 10, x2: pmDrainX, y2: uwbVccPinY, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('line', { x1: pmDrainX, y1: uwbVccPinY, x2: uwbVccRightX, y2: uwbVccPinY, stroke: '#cc3333', 'stroke-width': 1.5 });
    el('circle', { cx: uwbVccRightX, cy: uwbVccPinY, r: 2.5, fill: '#cc3333' });

    el('text', { x: BU_PWR_X + 8, y: BU_PWR_Y + BU_PWR_H - 1, 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#8866aa' }, 'high-side: S\u21923.3V, D\u2192VCC BU03, Q2 LOW gate = ON');

    // TROUBLESHOOT
    const BU_TS_X = BU_PWR_X + BU_PWR_W + 8;
    const BU_TS_Y = BU_PWR_Y + 2;
    const BU_TS_W = 112;
    const BU_TS_H = 68;
    el('rect', { x: BU_TS_X, y: BU_TS_Y, width: BU_TS_W, height: BU_TS_H, rx: 4, fill: '#1a0a0a', stroke: '#ff6644', 'stroke-width': 1.2 });
    el('text', { x: BU_TS_X + 6, y: BU_TS_Y + 10, 'font-family': 'JetBrains Mono', 'font-size': 6, 'font-weight': 'bold', fill: '#ff8866' }, 'TROUBLESHOOT');
    el('text', { x: BU_TS_X + 6, y: BU_TS_Y + 20, 'font-family': 'JetBrains Mono', 'font-size': 4.8, fill: '#ccaa88' }, 'G42 HIGH: gate\u22480V, VCC\u22483.3V');
    el('text', { x: BU_TS_X + 6, y: BU_TS_Y + 29, 'font-family': 'JetBrains Mono', 'font-size': 4.8, fill: '#ccaa88' }, 'G42 LOW: gate\u22483.3V, VCC\u22480V');
    el('text', { x: BU_TS_X + 6, y: BU_TS_Y + 38, 'font-family': 'JetBrains Mono', 'font-size': 4.8, fill: '#ccaa88' }, 'AO3401 SOT-23: 1=G 2=S 3=D');
    el('text', { x: BU_TS_X + 6, y: BU_TS_Y + 47, 'font-family': 'JetBrains Mono', 'font-size': 4.8, fill: '#ccaa88' }, 'R8 на gate, не на drain');
    el('text', { x: BU_TS_X + 6, y: BU_TS_Y + 56, 'font-family': 'JetBrains Mono', 'font-size': 4.8, fill: '#ccaa88' }, 'C2 справа от BU03: VCC + GND модуля');

    // BU03 GND — напрямую вниз, без блока ключа
    const uwbGndBotY = UWB_Y + UWB_H;
    el('line', { x1: uwbGndX, y1: uwbGndBotY, x2: uwbGndX, y2: BUS_GND_Y, stroke: '#556', 'stroke-width': 1.5 });
    el('circle', { cx: uwbGndX, cy: BUS_GND_Y, r: 3, fill: '#556' });
    el('text', { x: UWB_X + UWB_W - 10, y: uwbGndBotY - 5, 'text-anchor': 'end', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#556' }, 'GND');

    // C2 100n — справа от GND-линии BU03; пластины ||, выводы слева (VCC) и справа (GND)
    const c2X = UWB_X + UWB_W + 24;
    const c2CY = UWB_CY + 20;
    const c2PlateL = c2X - 6;
    const c2PlateR = c2X;
    const vccTapX = uwbVccRightX - 4;
    el('line', { x1: c2PlateL, y1: c2CY - 8, x2: c2PlateL, y2: c2CY + 8, stroke: '#cc88ff', 'stroke-width': 2 });
    el('line', { x1: c2PlateR, y1: c2CY - 8, x2: c2PlateR, y2: c2CY + 8, stroke: '#cc88ff', 'stroke-width': 2 });
    el('text', { x: c2X + 12, y: c2CY - 10, 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc88ff' }, 'C2 100n');
    // левый вывод → VCC (ломаная: влево, вверх, влево)
    const c2VccBendX = c2X - 20;
    el('line', { x1: c2PlateL, y1: c2CY, x2: c2VccBendX, y2: c2CY, stroke: '#cc3333', 'stroke-width': 1.2 });
    el('line', { x1: c2VccBendX, y1: c2CY, x2: c2VccBendX, y2: uwbVccPinY, stroke: '#cc3333', 'stroke-width': 1.2 });
    el('line', { x1: c2VccBendX, y1: uwbVccPinY, x2: vccTapX, y2: uwbVccPinY, stroke: '#cc3333', 'stroke-width': 1.2 });
    el('circle', { cx: vccTapX, cy: uwbVccPinY, r: 2.5, fill: '#cc3333' });
    // правый вывод → GND (ломаная: вправо, вниз, влево)
    const c2GndBendX = c2X + 16;
    el('line', { x1: c2PlateR, y1: c2CY, x2: c2GndBendX, y2: c2CY, stroke: '#556', 'stroke-width': 1.2 });
    el('line', { x1: c2GndBendX, y1: c2CY, x2: c2GndBendX, y2: uwbGndBotY, stroke: '#556', 'stroke-width': 1.2 });
    el('line', { x1: c2GndBendX, y1: uwbGndBotY, x2: uwbGndX, y2: uwbGndBotY, stroke: '#556', 'stroke-width': 1.2 });
    el('circle', { cx: uwbGndX, cy: uwbGndBotY, r: 2.5, fill: '#556' });

    const PWR_BLK_X = BUS_5V_X - 22;
    const PWR_BLK_Y = BUS_GND_Y - 45;
    el('rect', { x: PWR_BLK_X, y: PWR_BLK_Y, width: 44, height: 50, rx: 5, fill: '#0e0800', stroke: '#ff7700', 'stroke-width': 1.5 });
    el('text', { x: BUS_5V_X, y: PWR_BLK_Y + 16, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 8, 'font-weight': 'bold', fill: '#ff9933' }, 'АКБ');
    el('text', { x: BUS_5V_X, y: PWR_BLK_Y + 28, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, fill: '#996622' }, 'Li-Po');
    el('text', { x: BUS_5V_X, y: PWR_BLK_Y + 38, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#664411' }, '3.7V');
    const CHG_X = PWR_BLK_X - 58, CHG_Y = PWR_BLK_Y + 8;
    el('rect', { x: CHG_X, y: CHG_Y - 18, width: 48, height: 36, rx: 4, fill: '#0a1008', stroke: '#44aa66', 'stroke-width': 1.5 });
    el('text', { x: CHG_X + 24, y: CHG_Y - 4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, 'font-weight': 'bold', fill: '#44cc77' }, 'IP2312');
    el('text', { x: CHG_X + 24, y: CHG_Y + 8, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#338855' }, 'зарядка');
    el('line', { x1: CHG_X + 48, y1: CHG_Y, x2: PWR_BLK_X, y2: PWR_BLK_Y + 20, stroke: '#44aa66', 'stroke-width': 1.5 });
    const PWR_SW_Y = BUS_GND_Y - 80;
    el('line', { x1: BUS_5V_X, y1: PWR_BLK_Y, x2: BUS_5V_X, y2: PWR_SW_Y + 12, stroke: '#ff7700', 'stroke-width': 3 });
    el('rect', { x: BUS_5V_X - 18, y: PWR_SW_Y - 12, width: 36, height: 24, rx: 4, fill: '#1a0a00', stroke: '#ff7700', 'stroke-width': 1.5 });
    el('text', { x: BUS_5V_X, y: PWR_SW_Y + 3, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 7, 'font-weight': 'bold', fill: '#ff9933' }, 'PWR');
    el('text', { x: BUS_5V_X, y: PWR_SW_Y - 16, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#664411' }, 'разрыв АКБ');
    // === НОВАЯ СХЕМА ПИТАНИЯ: 2 параллельные ветки от батареи/выключателя ===
    const JUNC_Y = PWR_SW_Y - 12; // верх выключателя = точка разветвления
    const DCDC_5V_X = BUS_5V_X - 30; // TPS63020 понижающий → 5V, левее 5V шины
    const DCDC_3V3_X = BUS_5V_X + 30; // TPS63020 повышающий → 3.3V, правее
    const CONV_Y = 480;           // Y центр конверторов
    // --- JUNCTION: выход из выключателя = точка разветвления ---
    el('circle', { cx: BUS_5V_X, cy: JUNC_Y, r: 4, fill: '#ff7700' }); // junction dot

    // --- Ветка TPS63020 понижающий (→5V): влево → вниз → вверх к 5V BUS ---
    el('line', { x1: BUS_5V_X, y1: JUNC_Y, x2: DCDC_5V_X, y2: JUNC_Y, stroke: '#ff7700', 'stroke-width': 2 });
    el('line', { x1: DCDC_5V_X, y1: JUNC_Y, x2: DCDC_5V_X, y2: CONV_Y + 17, stroke: '#ff7700', 'stroke-width': 2 });
    el('rect', { x: DCDC_5V_X - 22, y: CONV_Y - 17, width: 44, height: 34, rx: 4, fill: '#1a0800', stroke: '#ff9933', 'stroke-width': 1.5 });
    el('text', { x: DCDC_5V_X, y: CONV_Y - 8, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6, 'font-weight': 'bold', fill: '#ff9933' }, 'TPS63020');
    el('text', { x: DCDC_5V_X, y: CONV_Y + 4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc6600' }, '↓ пониж.');
    el('text', { x: DCDC_5V_X, y: CONV_Y + 14, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#cc6600' }, '→5V');
    el('line', { x1: DCDC_5V_X, y1: CONV_Y - 17, x2: DCDC_5V_X, y2: BUS_3V3_Y + 10, stroke: '#ff7700', 'stroke-width': 3 });
    el('line', { x1: DCDC_5V_X, y1: BUS_3V3_Y + 10, x2: BUS_5V_X, y2: BUS_3V3_Y + 10, stroke: '#ff7700', 'stroke-width': 3 });
    // --- Ветка TPS63020 повышающий (→3.3V): вправо → вниз → вверх к 3V3 BUS ---
    el('line', { x1: BUS_5V_X, y1: JUNC_Y, x2: DCDC_3V3_X, y2: JUNC_Y, stroke: '#ff7700', 'stroke-width': 1.8 });
    el('line', { x1: DCDC_3V3_X, y1: JUNC_Y, x2: DCDC_3V3_X, y2: CONV_Y + 17, stroke: '#ff7700', 'stroke-width': 1.8 });
    el('rect', { x: DCDC_3V3_X - 22, y: CONV_Y - 17, width: 44, height: 34, rx: 4, fill: '#00100a', stroke: '#cc3333', 'stroke-width': 1.5 });
    el('text', { x: DCDC_3V3_X, y: CONV_Y - 8, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 6, 'font-weight': 'bold', fill: '#ff5555' }, 'TPS63020');
    el('text', { x: DCDC_3V3_X, y: CONV_Y + 4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#aa2222' }, '↑ повыш.');
    el('text', { x: DCDC_3V3_X, y: CONV_Y + 14, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#aa2222' }, '→3.3V');
    el('line', { x1: DCDC_3V3_X, y1: CONV_Y - 17, x2: DCDC_3V3_X, y2: BUS_3V3_Y, stroke: '#cc3333', 'stroke-width': 2 });
    el('circle', { cx: DCDC_3V3_X, cy: BUS_3V3_Y, r: 3, fill: '#cc3333' });
    // --- Метки шин ---
    el('text', { x: BUS_5V_X - 6, y: BUS_3V3_Y + 60, fill: '#ff9933', 'font-family': 'JetBrains Mono', 'font-size': 9, 'font-weight': 'bold', 'writing-mode': 'tb' }, '5V BUS');
    el('text', { x: DCDC_3V3_X + 6, y: BUS_3V3_Y + 40, fill: '#cc3333', 'font-family': 'JetBrains Mono', 'font-size': 7, 'font-weight': 'bold', 'writing-mode': 'tb' }, '3V3 SRC');


    const SW_W = 60, SW_H = 18;
    const SW_X = PIN_XR + 60;
    // Физические ключи PWR/SND/VIB — в разрыве питания; BL/SND/VIB положение — G37/G38/G47/G48
    const HW_SW_Y = espPinY(15);
    el('rect', { x: SW_X, y: HW_SW_Y - 28, width: SW_W + 20, height: 52, rx: 5, fill: '#0a0804', stroke: '#886633', 'stroke-width': 1, 'stroke-dasharray': '4,3' });
    el('text', { x: SW_X + (SW_W + 20) / 2, y: HW_SW_Y - 18, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5.5, fill: '#886633' }, 'корпус: PWR/SND/VIB/BL');
    el('text', { x: SW_X + (SW_W + 20) / 2, y: HW_SW_Y - 8, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#665522' }, 'PWR/SND/VIB — разрыв питания');
    el('text', { x: SW_X + (SW_W + 20) / 2, y: HW_SW_Y + 4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 5, fill: '#665522' }, 'BL→G37/G38; свободных GPIO нет');

    // ═══ PASSIVE COMPONENTS ═══
    function rV(cx,y1,y2,lbl,col){
      const my=(y1+y2)/2;
      el('line',{x1:cx,y1:y1,x2:cx,y2:my-12,stroke:col,'stroke-width':1.2});
      el('rect',{x:cx-5,y:my-12,width:10,height:24,rx:1,fill:'#060a12',stroke:col,'stroke-width':1});
      el('line',{x1:cx,y1:my+12,x2:cx,y2:y2,stroke:col,'stroke-width':1.2});
      el('text',{x:cx+8,y:my+4,'font-family':'JetBrains Mono','font-size':6,fill:col},lbl);
    }
    function rH(x1,x2,cy,lbl,col){
      const mx=(x1+x2)/2;
      el('line',{x1:x1,y1:cy,x2:mx-12,y2:cy,stroke:col,'stroke-width':1.2});
      el('rect',{x:mx-12,y:cy-5,width:24,height:10,rx:1,fill:'#060a12',stroke:col,'stroke-width':1});
      el('line',{x1:mx+12,y1:cy,x2:x2,y2:cy,stroke:col,'stroke-width':1.2});
      el('text',{x:mx,y:cy-8,'text-anchor':'middle','font-family':'JetBrains Mono','font-size':6,fill:col},lbl);
    }
    function cV(cx,y1,y2,lbl,col){
      const my=(y1+y2)/2;
      el('line',{x1:cx,y1:y1,x2:cx,y2:my-4,stroke:col,'stroke-width':1.2});
      el('line',{x1:cx-8,y1:my-4,x2:cx+8,y2:my-4,stroke:col,'stroke-width':2});
      el('line',{x1:cx-8,y1:my+4,x2:cx+8,y2:my+4,stroke:col,'stroke-width':2});
      el('line',{x1:cx,y1:my+4,x2:cx,y2:y2,stroke:col,'stroke-width':1.2});
      el('text',{x:cx+12,y:my+4,'font-family':'JetBrains Mono','font-size':6,fill:col},lbl);
    }
    // R1 4.7kΩ — SDA (G9, leftIdx14) pull-up → 3V3
    const sdaPuY = PIN_Y0 + 14 * PIN_DY; // 380
    rV(462, BUS_3V3_Y, sdaPuY, 'R1 4.7k', '#44ccaa');
    el('circle',{cx:462,cy:sdaPuY,r:3,fill:'#44ccaa'});
    // R2 4.7kΩ — SCL (G8, leftIdx11) pull-up → 3V3
    const sclPuY = PIN_Y0 + 11 * PIN_DY; // 314
    rV(453, BUS_3V3_Y, sclPuY, 'R2 4.7k', '#33aa88');
    el('circle',{cx:453,cy:sclPuY,r:3,fill:'#33aa88'});
    // R6 1kΩ — UART TX (G17) → DFPlayer RX (horizontal, on UART line)
    rH(DFP_PIN_X + 10, PIN_XL - 10, DFP_PIN_Y0, 'R6 1k', '#ff9922');
    // R7 10kΩ — SharedRST (G12, leftIdx17) pull-up → 3V3
    const rstPuX = 477, rstPinY2 = PIN_Y0 + 17 * PIN_DY; // y=446
    rV(rstPuX, BUS_3V3_Y, rstPinY2, 'R7 10k', '#ffaa44');
    el('line',{x1:rstPuX,y1:rstPinY2,x2:PIN_XL,y2:rstPinY2,stroke:'#ffaa44','stroke-width':1});
    el('circle',{cx:PIN_XL,cy:rstPinY2,r:3,fill:'#ffaa44'});
    // C4 10nF — SharedRST debounce (G12 → GND)
    cV(rstPuX - 14, rstPinY2, BUS_GND_Y, 'C4 10n', '#ffaa44');
    el('circle',{cx:rstPuX-14,cy:rstPinY2,r:2.5,fill:'#ffaa44'});
    el('line',{x1:rstPuX-14,y1:rstPinY2,x2:rstPuX,y2:rstPinY2,stroke:'#ffaa44','stroke-width':1});
    el('circle',{cx:rstPuX-14,cy:BUS_GND_Y,r:3,fill:'#556'});
    // C1-C3 bypass caps: horizontal cap symbol, branches from VCC line, ends at GND symbol
    function gndSym(x, y) {
      el('line',{x1:x-7,y1:y,   x2:x+7,y2:y,   stroke:'#556','stroke-width':1.5});
      el('line',{x1:x-4,y1:y+4, x2:x+4,y2:y+4, stroke:'#556','stroke-width':1.2});
      el('line',{x1:x-1,y1:y+8, x2:x+1,y2:y+8, stroke:'#556','stroke-width':1});
    }
    function capH(vccX, vccY, lbl, col) {
      // branch from VCC line rightward
      el('circle',{cx:vccX,cy:vccY,r:3,fill:col}); // junction on VCC line
      el('line',{x1:vccX,y1:vccY,x2:vccX+12,y2:vccY,stroke:col,'stroke-width':1.2});
      el('line',{x1:vccX+12,y1:vccY-8,x2:vccX+12,y2:vccY+8,stroke:col,'stroke-width':2});
      el('line',{x1:vccX+18,y1:vccY-8,x2:vccX+18,y2:vccY+8,stroke:col,'stroke-width':2});
      el('line',{x1:vccX+18,y1:vccY,x2:vccX+30,y2:vccY,stroke:col,'stroke-width':1.2});
      el('line',{x1:vccX+30,y1:vccY,x2:vccX+30,y2:vccY+8,stroke:'#556','stroke-width':1.2});
      gndSym(vccX+30, vccY+8);
      el('text',{x:vccX+15,y:vccY-12,'text-anchor':'middle','font-family':'JetBrains Mono','font-size':5.5,fill:col},lbl);
    }
    // C1 — LoRa VCC line at x=LORA_X+5, branch at y=80
    capH(LORA_X + 5, 80, 'C1 100n', '#4488ff');
    // C2 — рисуется у BU03 (VCC справа → GND ключа)
    // C3 — DFPlayer 5V line: segment x=250, from DFP_Y(255) up to DFP_Y-15(240)
    // Branch at midpoint y=248, cap goes rightward
    capH(250, DFP_Y - 8, 'C3 100n', '#bb88ff');
  </script>

  <script>
    const svgEl = document.getElementById('s');
    let vb = { x: 0, y: 0, w: 1550, h: 1300 };
    let isPan = false, startPt = { x: 0, y: 0 };

    function updateVB() {
      svgEl.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    }

    svgEl.addEventListener('wheel', e => {
      e.preventDefault();
      const scale = e.deltaY > 0 ? 1.1 : 0.9;
      const rect = svgEl.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      const my = (e.clientY - rect.top) / rect.height;
      const nw = vb.w * scale, nh = vb.h * scale;
      vb.x += (vb.w - nw) * mx;
      vb.y += (vb.h - nh) * my;
      vb.w = nw; vb.h = nh;
      updateVB();
    }, { passive: false });

    svgEl.addEventListener('mousedown', e => {
      isPan = true; startPt = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', e => {
      if (!isPan) return;
      const rect = svgEl.getBoundingClientRect();
      const dx = (e.clientX - startPt.x) / rect.width * vb.w;
      const dy = (e.clientY - startPt.y) / rect.height * vb.h;
      vb.x -= dx; vb.y -= dy;
      startPt = { x: e.clientX, y: e.clientY };
      updateVB();
    });
    window.addEventListener('mouseup', () => isPan = false);
    svgEl.addEventListener('dblclick', () => {
      vb = { x: 0, y: 0, w: 1550, h: 1300 };
      updateVB();
    });
  </script>
